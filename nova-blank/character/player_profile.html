<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova: {{ name }}</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header class="brand-header">
      <h1 class="brand">{{ name }}</h1>
    </header>
    <nav>
      {{ nav }}
    </nav>
    <div class="content">
      <table>
        <tr><th>Name</th><th>Age</th><th>Rank</th><th>Clan</th><th>House</th><th>Trait</th><th>Trauma</th><th>Pneuma</th><th>Deftness</th><th>Handling</th><th>Tenacity</th><th>Wit</th><th>Perception</th><th>Composure</th><th>Pluck</th><th>Potential</th><th>Techniques</th><th>Edit</th><th>Delete</th></tr>
        {{ rows }}
      </table>
    </div>
  </div>
</body>
</html>
