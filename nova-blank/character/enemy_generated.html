<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova: {{ name }} Generated</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header class="brand-header">
      <h1 class="brand">{{ name }} (Threat Level {{ threat_level }})</h1>
    </header>
    <nav>
      {{ nav }}
    </nav>
    <div class="content">
      <h2>Skills</h2>
      <table>
        <tr><th>Skill</th><th>Value</th></tr>
        {{ stat_rows }}
      </table>

      <h2>Talent: {{ talent_name }}</h2>
      <p>{{ talent_effect }}</p>
      <p>Uses: {{ talent_uses }}</p>
      <p>Cooldown: {{ talent_cooldown }} rounds</p>

      <h2>Drops</h2>
      <p>{{ drops }}</p>
    </div>
  </div>
</body>
</html>
