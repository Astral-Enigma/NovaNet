{% extends "_layout.html" %}
{% block heading %}New Enemy{% endblock %}
{% block content %}
      <form method="post" action="/enemy">
        <label>Name: <input type="text" name="name" required /></label>
        <label>Description: <input type="text" name="description" required /></label>
        <label>Habitat: <select name="habitat" required>{% for h in habitats %}<option value="{{ h }}">{{ h }}</option>{% endfor %}</select></label>
        <label>Main Skill: <select name="main_skill" required>{% for s in skills %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select></label>
        <label>Default Threat Level (1-6): <input type="number" name="default_threat_level" min="1" max="6" required /></label>
        <label>Talent Name: <input type="text" name="talent_name" required /></label>
        <label>Talent Effect: <input type="text" name="talent_effect" required /></label>
        <label>Drops: <input type="text" name="drops" required /></label>
        <button type="submit">Add Enemy</button>
        <a href="/enemies" class="section-link">Cancel</a>
      </form>
{% endblock %}
