<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Character</title>
</head>
<body>
  <h1>Edit Character</h1>

  <form method="post" action="/character/{{ index }}/edit">
    <label>Name: <input type="text" name="name" value="{{ name }}" required /></label><br />
    <label>Age: <input type="number" name="age" value="{{ age }}" required /></label><br />
    <label>Rank: <input type="text" name="rank" value="{{ rank }}" required /></label><br />
    <label>Clan: <input type="text" name="clan" value="{{ clan }}" required /></label><br />
    <label>House: <input type="text" name="house" value="{{ house }}" required /></label><br />
    <label>Trait: <input type="text" name="trait" value="{{ trait }}" required /></label><br />
    <label>Trauma: <input type="number" name="trauma" value="{{ trauma }}" required /></label><br />
    <label>Pneuma: <input type="number" name="pneuma" value="{{ pneuma }}" required /></label><br />
    <label>Deftness: <input type="number" name="deftness" value="{{ deftness }}" required /></label><br />
    <label>Handling: <input type="number" name="handling" value="{{ handling }}" required /></label><br />
    <label>Tenacity: <input type="number" name="tenacity" value="{{ tenacity }}" required /></label><br />
    <label>Wit: <input type="number" name="wit" value="{{ wit }}" required /></label><br />
    <label>Perception: <input type="number" name="perception" value="{{ perception }}" required /></label><br />
    <label>Composure: <input type="number" name="composure" value="{{ composure }}" required /></label><br />
    <label>Pluck: <input type="number" name="pluck" value="{{ pluck }}" readonly /></label><br />
    <label>Potential: <input type="number" name="potential" value="{{ potential }}" readonly /></label><br />
    <button type="submit">Save</button>
    <a href="/">Cancel</a>
  </form>
</body>
</html>
