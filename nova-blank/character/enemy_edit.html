{% extends "_layout.html" %}
{% block heading %}Edit Enemy{% endblock %}
{% block content %}
      <form method="post" action="/enemy/{{ id }}/edit">
        <label>Name: <input type="text" name="name" value="{{ name }}" required /></label>
        <label>Description: <input type="text" name="description" value="{{ description }}" required /></label>
        <label>Habitat: <select name="habitat" required>{% for h in habitats %}<option value="{{ h }}"{% if h == selected_habitat %} selected{% endif %}>{{ h }}</option>{% endfor %}</select></label>
        <label>Main Skill: <select name="main_skill" required>{% for s in skills %}<option value="{{ s }}"{% if s == selected_skill %} selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
        <label>Default Threat Level (1-6): <input type="number" name="default_threat_level" value="{{ default_threat_level }}" min="1" max="6" required /></label>
        <label>Talent Name: <input type="text" name="talent_name" value="{{ talent_name }}" required /></label>
        <label>Talent Effect: <input type="text" name="talent_effect" value="{{ talent_effect }}" required /></label>
        <label>Drops: <input type="text" name="drops" value="{{ drops }}" required /></label>
        <button type="submit">Save</button>
        <a href="/enemies" class="section-link">Cancel</a>
      </form>
{% endblock %}
