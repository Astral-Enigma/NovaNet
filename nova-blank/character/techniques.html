<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova: {{ character_name }} Techniques</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header class="brand-header">
      <h1 class="brand">{{ character_name }}'s Techniques</h1>
    </header>
    <nav>
      {{ nav }}
    </nav>
    <div class="content">
      {{ add_link }}
      <table>
        <tr><th>Name</th><th>Description</th><th>Toll</th><th>Type</th><th>Category</th><th>Effect</th><th>Burst</th><th>Duration</th><th>Edit</th><th>Delete</th></tr>
        {{ rows }}
      </table>
      <p><a href="/character/{{ id }}/edit" class="section-link">Back to Character</a></p>
    </div>
  </div>
</body>
</html>
