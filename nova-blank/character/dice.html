<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova: Dice Roller</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header class="brand-header">
      <h1 class="brand">Dice Roller</h1>
    </header>
    <nav>
      {{ nav }}
    </nav>
    <div class="content">
      <form method="post" action="/dice">
        <label>Rank (auto Roll/Keep): <select name="rank">
          <option value="">-- Custom --</option>
          {{ rank_options }}
        </select></label>
        <label>Custom Roll: <input type="number" name="roll_count" min="1" value="1" /></label>
        <label>Keep: <input type="number" name="keep_count" min="1" value="1" /></label>
        <button type="submit">Roll</button>
      </form>

      {{ result }}
    </div>
  </div>
</body>
</html>
